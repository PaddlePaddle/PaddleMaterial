# @package _global_
defaults:
  - Run: default
  - Logger: default
  - Dataset: jarvis
  - Dataset/transform: mean_std_scaling
  - Graph_converter: FindPointsInSpheres
  - Model: megnet
  - Trainer: default
  - Optimizer: Adam
  - Learning_rate: Cosine
  - Loss: L1Loss
  - _self_

Global:
  label_names: ["bulk_modulus_kv"]
  model_name: "megnet"
  dataset_name: "jarvis_dft_3d_2021"
  do_train: True
  do_eval: False
  do_test: False
  seed: 42

Experiment:
  name_for_best_metric: ${Global.label_names[0]}
  jarvis_data_name: "dft_3d_2021"

_Metric:
  keys: ${Global.label_names}
  values:
    - ${Loss}

Predict:
  graph_converter: ${Graph_converter}
  eval_with_no_grad: True

hydra:
  job:
    name: ${Global.label_names[0]}
    chdir: True
  run:
    dir: ./output/${Global.model_name}_${Global.dataset_name}_${hydra.job.name}/t_${now:%Y%m%d_%H%M%S}_seed_${Global.seed}

# ==========================================
# Custom parameters (will override defaults)
# ==========================================

# Trainer:
#   max_epochs: 2000
#   save_freq: 1
#   log_freq: 1

Dataset:
  dataset:
    __init_params__:
      transforms:
        - __class_name__: Scale
          __init_params__:
            scale: 0.01
            apply_keys: ${Global.label_names[0]}

Optimizer:
  __init_params__:
    beta1: 0.9
    beta2: 0.999

Learning_rate:
  __init_params__:
    eta_min: 0.0001
