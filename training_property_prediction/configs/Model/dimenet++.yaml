__class_name__: DimeNetPlusPlus
__init_params__:
  # layer parameters
  out_channels: 1
  hidden_channels: 128
  num_blocks: 4
  int_emb_size: 64
  basis_emb_size: 8
  out_emb_channels: 256
  num_spherical: 7
  num_embeddings: 95
  num_radial: 6
  otf_graph: false
  cutoff: 7.0
  max_num_neighbors: 20
  envelope_exponent: 5
  num_before_skip: 1
  num_after_skip: 2
  num_output_layers: 3
  readout: mean
  # predict value name
  property_names: ${Global.label_names}
  # data preprocess parameters
  # data_norm_mean: 0.0
  # data_norm_std: 1.0
  # loss
  loss_type: 'l1_loss'
