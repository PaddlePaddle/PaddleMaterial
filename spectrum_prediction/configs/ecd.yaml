# ECFormer ECD Task Configuration
# Task: Electronic Circular Dichroism Spectrum Prediction

Global:
  do_train: True
  do_eval: True
  do_test: True
  label_names: ["peak_number", "peak_position", "peak_height"]

Dataset:
  train:
    dataset:
      __class_name__: ECDDataset
      __init_params__:
        data_path: ./datasets/ECD
        data_count: null  # null means use all data
        use_geometry_enhanced: True
        use_column_info: False
    loader:
      num_workers: 4
      collate_fn: ECDCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 128
        shuffle: True
  
  val:
    dataset:
      __class_name__: ECDDataset
      __init_params__:
        data_path: ./datasets/ECD
        data_count: null
        use_geometry_enhanced: True
        use_column_info: False
    loader:
      num_workers: 4
      collate_fn: ECDCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 128
        shuffle: False

  test:
    dataset:
      __class_name__: ECDDataset
      __init_params__:
        data_path: ./datasets/ECD
        data_count: null
        use_geometry_enhanced: True
        use_column_info: False
    loader:
      num_workers: 4
      collate_fn: ECDCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 128
        shuffle: False

Model:
  __class_name__: ECFormerECD
  __init_params__:
    full_atom_feature_dims: [119, 9, 12, 14, 17, 9, 14, 2, 10]
    full_bond_feature_dims: [8, 23, 3]
    bond_float_names: ['bond_length']
    bond_angle_float_names: ['bond_angle', 'TPSA', 'RASA', 'RPSA', 'MDEC', 'MATS']
    bond_id_names: ['bond_dir', 'bond_type', 'is_in_ring']
    num_layers: 5
    emb_dim: 256
    drop_ratio: 0.0
    graph_pooling: 'sum'
    use_geometry_enhanced: True
    max_node_num: 63
    num_heads: 4
    tf_layers: 2
    tf_dropout: 0.1
    max_peaks: 9
    num_position_classes: 20
    height_classes: 2

Optimizer:
  __class_name__: AdamW
  __init_params__:
    lr: 0.001
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8
    weight_decay: 0.01

Metric:
  __class_name__: ECDMetrics
  __init_params__:
    num_position_classes: 20
    max_peaks: 9

Trainer:
  output_dir: ./output/ecformer_ecd
  max_epochs: 100
  log_freq: 10
  save_freq: 5
  eval_freq: 1
  seed: 42
  use_amp: False
  start_eval_epoch: 1
  amp_level: 'O1'
  eval_with_no_grad: True
  compute_metric_during_train: False
  metric_strategy_during_eval: 'step'
  use_visualdl: False
  use_wandb: False
  use_tensorboard: False