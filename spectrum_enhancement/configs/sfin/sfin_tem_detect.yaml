Global:
  do_train: True
  do_eval: True
  do_test: True
  prim_eager_enabled: False

Trainer:
  max_epochs: 500
  seed: 42
  output_dir: ./output/sfin_tem_detect
  save_freq: 100
  log_freq: 100
  start_eval_epoch: 1
  eval_freq: 1
  pretrained_model_path: null
  pretrained_weight_name: null
  resume_from_checkpoint: null
  use_amp: False
  amp_level: "O1"
  eval_with_no_grad: True
  gradient_accumulation_steps: 1

  best_metric_indicator: "eval_metric"
  name_for_best_metric: "gt_detect"
  greater_is_better: True

  compute_metric_during_train: True
  metric_strategy_during_eval: "epoch"

  use_visualdl: False
  use_wandb: False
  use_tensorboard: False

Model:
  __class_name__: SFIN
  __init_params__:
    in_channels: 1
    base_channels: 64
    num_blocks: 8
    input_name: "noisy"
    target_name: "gt_detect"
    loss_type: "l1"
    loss_weight: 1.0

Optimizer:
  __class_name__: Adam
  __init_params__:
    lr:
      __class_name__: MultiStepDecay
      __init_params__:
        learning_rate: 2.0e-4
        milestones: [250, 400, 425, 450, 475]
        gamma: 0.5
        by_epoch: True
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.0

Metric:
  gt_detect:
    __class_name__: PSNRMetric
    __init_params__:
      data_range: 255.0

Dataset:
  train:
    dataset:
      __class_name__: STEMImageDataset
      __init_params__:
        data_path: "./data"
        noisy_subdir: "noisy"
        target_subdir: "gt_detect"
        file_suffix: ".png"
        strict_index_naming: True
        scale_to_unit: False
        download: True
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: True
        drop_last: True
        batch_size: 8
    loader:
      num_workers: 0
      use_shared_memory: False
      collate_fn: DefaultCollator

  val:
    dataset:
      __class_name__: STEMImageDataset
      __init_params__:
        data_path: "./data_test"
        noisy_subdir: "noisy"
        target_subdir: "gt_detect"
        file_suffix: ".png"
        strict_index_naming: True
        scale_to_unit: False
        download: True
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 1
    loader:
      num_workers: 0
      use_shared_memory: False
      collate_fn: DefaultCollator

  test:
    dataset:
      __class_name__: STEMImageDataset
      __init_params__:
        data_path: "./data_test"
        noisy_subdir: "noisy"
        target_subdir: "gt_detect"
        file_suffix: ".png"
        strict_index_naming: True
        scale_to_unit: False
        download: True
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 1
    loader:
      num_workers: 0
      use_shared_memory: False
      collate_fn: DefaultCollator
