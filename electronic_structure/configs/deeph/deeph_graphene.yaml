    energy_component: summation
    max_element: -1
    statistics: false
    normalizer: false
    boxcox: false
  graph:
    radius: 6.0
    max_num_nbr: 0
    create_from_dft: false
    if_lcmp_graph: true
    separate_onsite: false
    new_sp: false
  train:
    epochs: 5
    pretrained: ''
    resume: ''
    train_ratio: 0.6
    val_ratio: 0.2
    test_ratio: 0.2
    early_stopping_loss: 0.0
    early_stopping_loss_epoch:
    - 0.0
    - 500
    revert_then_decay: true
    revert_threshold: 30
    revert_decay_epoch:
    - 800
    - 2000
    - 3000
    - 4000
    revert_decay_gamma:
    - 0.4
    - 0.5
    - 0.5
    - 0.4
    clip_grad: true
    clip_grad_value: 4.2
    switch_sgd: false
    switch_sgd_lr: 0.0001
    switch_sgd_epoch: -1
  hyperparameter:
    batch_size: 4
    dtype: float32
    optimizer: adam
    learning_rate: 0.001
    lr_scheduler: ''
    lr_milestones: []
    momentum: 0.9
    weight_decay: 0
    criterion: MaskMSELoss
    retain_edge_fea: true
    lambda_eij: 0.0
    lambda_ei: 0.1
    lambda_etot: 0.0
  network:
    atom_fea_len: 64
    edge_fea_len: 128
    gauss_stop: 6.0
    num_l: 5
    aggr: add
    distance_expansion: GaussianBasis
    if_exp: true
    if_multiplelinear: false
    if_edge_update: true
    if_lcmp: true
    normalization: LayerNorm
    atom_update_net: CGConv
    trainable_gaussians: false
    type_affine: false
Dataset:
  train:
    dataset:
      __class_name__: DeepHDataset
      __init_params__:
        split: train
        split_seed: 42
        build_structure_cfg:
          format: array
          primitive: false
          niggli: false
          canocial: true
        build_graph_cfg:
          __class_name__: FindPointsInSpheres
          __init_params__:
            cutoff: 6.0
            pbc:
            - 1
            - 1
            - 1
            eps: 1.0e-08
        config: ${DeepH}
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: true
        drop_last: false
        batch_size: 1
    loader:
      num_workers: 0
      use_shared_memory: false
      collate_fn: DefaultCollator
  val:
    dataset:
      __class_name__: DeepHDataset
      __init_params__:
        split: val
        split_seed: 42
        build_structure_cfg:
          format: array
          primitive: false
          niggli: false
          canocial: true
        build_graph_cfg:
          __class_name__: FindPointsInSpheres
