Global:
  do_train: true
  do_eval: true
  do_test: true
Predict:
  eval_with_no_grad: true
Trainer:
  max_epochs: 5
  seed: 42
  output_dir: ./output/deeph_graphene
  save_freq: 1
  log_freq: 1
  start_eval_epoch: 0
  eval_freq: 1
  pretrained_model_path: null
  pretrained_weight_name: null
  resume_from_checkpoint: null
  use_amp: false
  amp_level: O1
  eval_with_no_grad: true
  gradient_accumulation_steps: 1
  best_metric_indicator: eval_loss
  name_for_best_metric: loss
  greater_is_better: false
  compute_metric_during_train: false
  metric_strategy_during_eval: epoch
  use_visualdl: false
  use_wandb: false
  use_tensorboard: false
Model:
  __class_name__: DeepHHamiltonian
  __init_params__:
    num_species: 1
    in_atom_fea_len: 64
    in_edge_fea_len: 128
    num_orbital: 169
    num_l: 5
    gauss_stop: 6.0
    if_exp: true
    normalization: LayerNorm
    target_name: label
Optimizer:
  __class_name__: Adam
  __init_params__:
    lr: 0.001
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-08
  clip_norm_global: 4.2
DeepH:
  basic:
    graph_dir: ./data/deeph/graphene/graph_data
    save_dir: ./output/deeph_graphene
