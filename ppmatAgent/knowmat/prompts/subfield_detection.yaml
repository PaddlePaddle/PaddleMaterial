prompt_template: |
  你是一个材料科学文献分类专家。根据以下论文文本，判断论文的三维分类。

  你需要判断以下三个维度：

  **base_material**（必填，单选）：
  - Metals（金属与合金：钢铁、铝合金、钛合金、镍基高温合金、铜合金、高熵合金等）
  - Ceramics_Inorganic（无机非金属/陶瓷/玻璃/碳基材料：氧化铝、氮化硅、碳化硅、YSZ、石墨烯、碳纳米管等）
  - Polymers（高分子/聚合物：环氧、聚酰胺、PEEK、水凝胶、导电聚合物等）
  - Composites（复合材料：PMC/CMC/MMC、纤维增强、颗粒增强等）
  - Organic_Small_Molecules（有机小分子：MOF、COF、有机染料、有机半导体等）

  **application**（必填，单选）：
  - Structural（结构类：侧重力学性能、承载能力、疲劳、强度、韧性、耐磨等）
  - Functional（功能类：侧重光、电、磁、热、声、化学催化、电化学、传感等）

  **research_paradigm**（必填，单选）：
  - Experimental（纯物理实验表征，包括使用辅助性计算工具如 Thermo-Calc 相图预测）
  - Pure_Simulation（纯理论计算、仿真分析：DFT、MD、FEM、CALPHAD、相场等）
  - Hybrid（实验与仿真/计算深度结合，仅当计算/模拟是论文核心贡献之一时使用）

  **domain_overlays**（可选，多选，可为空列表）：
  - Machining：论文涉及切削/磨削/车削/铣削等加工过程
  - Coating：论文涉及涂层/薄膜/热障涂层/EBC
  - Battery：论文涉及电池/电化学储能

  **patch_tags**（可选，多选，可为空列表）：
  从以下标签中选择适用的：
  Gradient, 2D, Biomaterial, Metamaterial, Porous, Nanomaterial,
  High_Entropy, Battery, TRIP_or_Deformation_Transformation,
  Thermal_Barrier_or_EBC, Directional_Anisotropy,
  Hydrogen_Assisted, Laser_Assisted, Interface_Dominated,
  Additive_Manufacturing, Thermal_Cycling, SPD

  使用提供的工具返回结构化分类结果。仅返回分类，不要生成自由文本描述或额外的提示词。

  论文文本：
  {paper_text}

