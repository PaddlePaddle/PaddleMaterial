Global:
  label_names:
    - energy
  do_train: true
  do_eval: true
  do_test: true

  build_molecule_cfg:
    format: dict
    sanitize: false
    add_hs: false
    remove_hs: false
    kekulize: false
    num_cpus: 10

  graph_converter:
    __class_name__: RadiusGraphConverter
    __init_params__:
      cutoff: 5.0
      return_triplet_indices: true
      num_cpus: 10

Trainer:
  max_epochs: 500
  seed: 42
  output_dir: ./output/spherenet_ethanol
  save_freq: 50
  log_freq: 10
  start_eval_epoch: 1
  eval_freq: 1
  use_amp: false
  eval_with_no_grad: true
  gradient_accumulation_steps: 1
  best_metric_indicator: eval_metric
  name_for_best_metric: energy
  greater_is_better: false
  compute_metric_during_train: false
  metric_strategy_during_eval: step
  pretrained_model_path:
Model:
  __class_name__: SphereNet
  __init_params__:
    energy_and_force: true
    cutoff: 5.0
    num_layers: 4
    hidden_channels: 128
    out_channels: 1
    int_emb_size: 64
    basis_emb_size_dist: 8
    basis_emb_size_angle: 8
    basis_emb_size_torsion: 8
    out_emb_channels: 256
    num_spherical: 7
    num_radial: 6
    envelope_exponent: 5
    num_before_skip: 1
    num_after_skip: 2
    num_output_layers: 3
    output_init: zeros
    property_name: energy

Metric:
  energy:
    __class_name__: paddle.nn.L1Loss
    __init_params__: {}
  force:
    __class_name__: paddle.nn.L1Loss
    __init_params__: {}
Optimizer:
  __class_name__: Adam
  __init_params__:
    beta1: 0.9
    beta2: 0.999
    lr:
      __class_name__: Cosine
      __init_params__:
        learning_rate: 0.0005
        eta_min: 0.00001
        by_epoch: true

Dataset:
  train:
    dataset:
      __class_name__: MD17Dataset
      __init_params__:
        path: ./data/md17
        name: ethanol
        split: train
        split_file: ./data/md17/splits/ethanol_train_idx.npy
        build_molecule_cfg: ${Global.build_molecule_cfg}
        build_graph_cfg: ${Global.graph_converter}
        force_key: force
    loader:
      num_workers: 4
      use_shared_memory: false
      collate_fn: RadiusGraphCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 8
        shuffle: true
        drop_last: true
  val:
    dataset:
      __class_name__: MD17Dataset
      __init_params__:
        path: ./data/md17
        name: ethanol
        split: val
        split_file: ./data/md17/splits/ethanol_val_idx.npy
        build_molecule_cfg: ${Global.build_molecule_cfg}
        build_graph_cfg: ${Global.graph_converter}
        force_key: force
    loader:
      num_workers: 4
      use_shared_memory: false
      collate_fn: RadiusGraphCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 8
        shuffle: false
        drop_last: false
  test:
    dataset:
      __class_name__: MD17Dataset
      __init_params__:
        path: ./data/md17
        name: ethanol
        split: test
        split_file: ./data/md17/splits/ethanol_test_idx.npy
        build_molecule_cfg: ${Global.build_molecule_cfg}
        build_graph_cfg: ${Global.graph_converter}
        force_key: force
    loader:
      num_workers: 4
      use_shared_memory: false
      collate_fn: RadiusGraphCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 8
        shuffle: false
        drop_last: false

Predict:
  eval_with_no_grad: false
  graph_converter: ${Global.graph_converter}
