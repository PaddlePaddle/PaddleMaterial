model:
  type: "sevennet"
  num_species: 100
  hidden_dim: 32
  num_message_layers: 3
  num_rbf: 32
  cutoff: 4.0

dataset:
  type: "extxyz"
  # 使用仓库内相对路径或用户自行指定
  # 示例: 下载数据集后放在 data/hfo2.extxyz
  path: "data/hfo2.extxyz"
  cutoff: 4.0
  valid_ratio: 0.1

dataloader:
  batch_size: 2
  shuffle: true
  num_workers: 0

optimizer:
  type: "adam"
  lr: 0.001

lr_scheduler:
  type: "constant"

loss:
  type: "mse"
  force_loss_weight: 0.1

trainer:
  epoch: 2
  per_epoch: 1
  seed: 42
  device: "auto"

log:
  save_dir: "./output/sevennet_hfo2"
  log_interval: 1
  save_interval: 1