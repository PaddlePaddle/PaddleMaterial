Global:
  do_train: True
  do_eval: True
  do_test: False

  label_names: ['energy']

  graph_converter:
    __class_name__: FindPointsInSpheres
    __init_params__:
      cutoff: 5.0

  prim_eager_enabled: True


Trainer:
  max_epochs: 500
  seed: 42
  output_dir: ./output/schnet_md17_ethanol
  save_freq: 50
  log_freq: 50

  start_eval_epoch: 1
  eval_freq: 5
  pretrained_model_path: null
  pretrained_weight_name: null
  resume_from_checkpoint: null
  use_amp: False
  eval_with_no_grad: True
  gradient_accumulation_steps: 1

  best_metric_indicator: 'eval_metric'
  name_for_best_metric: "energy"
  greater_is_better: False


Model:
  __class_name__: SchNet
  __init_params__:
    n_atom_basis: 64
    n_interactions: 6
    n_filters: 64
    cutoff: 5.0
    n_gaussians: 25
    max_z: 100
    readout: "sum"
    property_names: ${Global.label_names}
    data_mean: 0.0
    data_std: 1.0
    loss_type: "l1_loss"
    compute_forces: False


Optimizer:
  __class_name__: Adam
  __init_params__:
    lr:
      __class_name__: Cosine
      __init_params__:
        learning_rate: 1e-4
        eta_min: 1e-7
        by_epoch: False


Metric:
  energy:
    __class_name__: IgnoreNanMetricWrapper
    __init_params__:
      __class_name__: paddle.nn.L1Loss
      __init_params__: {}


Dataset:
  train:
    dataset:
      __class_name__: MD17Dataset
      __init_params__:
        path: "./data/md17"
        molecule: "ethanol"
        property_names: ${Global.label_names}
        build_graph_cfg: ${Global.graph_converter}
        max_samples: 50000
    num_workers: 4
    use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: True
        drop_last: False
        batch_size: 64
  val:
    dataset:
      __class_name__: MD17Dataset
      __init_params__:
        path: "./data/md17"
        molecule: "ethanol"
        property_names: ${Global.label_names}
        build_graph_cfg: ${Global.graph_converter}
        max_samples: 10000
    num_workers: 4
    use_shared_memory: False
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 64
