Global:
  do_train: True
  do_eval: True
  do_test: True

  label_names: ["energy"]
  graph_converter:
    __class_name__: FindPointsInSpheres
    __init_params__:
      # Paper-priority setting.
      cutoff: 5.0
      pbc: [0, 0, 0]
      num_cpus: 4


Trainer:
  # Not explicitly fixed in SchNet paper; follow schnetpack default trainer.
  max_epochs: 100000
  seed: 42
  output_dir: ./output/schnet_iso17_paper
  save_freq: 100
  log_freq: 20
  start_eval_epoch: 1
  eval_freq: 1
  pretrained_model_path: null
  pretrained_weight_name: null
  resume_from_checkpoint: null
  use_amp: False
  amp_level: "O1"
  eval_with_no_grad: True
  gradient_accumulation_steps: 1
  best_metric_indicator: "eval_metric"
  name_for_best_metric: "energy"
  greater_is_better: False
  compute_metric_during_train: True
  metric_strategy_during_eval: "epoch"
  use_visualdl: False
  use_wandb: False
  use_tensorboard: False


Model:
  __class_name__: SchNet
  __init_params__:
    # Paper-priority setting.
    n_atom_basis: 128
    n_interactions: 6
    n_filters: 128
    cutoff: 5.0
    n_rbf: 20
    max_z: 100
    property_name: "energy"
    readout: "sum"
    data_mean: 0.0
    data_std: 1.0
    loss_type: "mse_loss"


Optimizer:
  __class_name__: AdamW
  __init_params__:
    weight_decay: 0.0
    lr:
      __class_name__: ReduceOnPlateau
      __init_params__:
        learning_rate: 1e-3
        indicator: "eval_loss"
        indicator_name: "loss"
        mode: "min"
        factor: 0.5
        patience: 75
        threshold: 0.0
        threshold_mode: "rel"
        cooldown: 10
        min_lr: 0.0
        epsilon: 1e-8
        by_epoch: True


Metric:
  energy:
    __class_name__: paddle.nn.L1Loss
    __init_params__: {}


Dataset:
  # Dataset package mirror (uploaded):
  # https://paddle-org.bj.bcebos.com/paddlematerials/datasets/ISO17/iso17.tar.gz
  train:
    dataset:
      __class_name__: ISO17Dataset
      __init_params__:
        path: "./data/iso17"
        url: "https://paddle-org.bj.bcebos.com/paddlematerials/datasets/ISO17/iso17.tar.gz"
        subset: "train"
        split_file: "split_iso17_ref90_testother_seed42.npz"
        property_names: ${Global.label_names}
        build_graph_cfg: ${Global.graph_converter}
        seed: 42
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: True
        drop_last: True
        batch_size: 32

  val:
    dataset:
      __class_name__: ISO17Dataset
      __init_params__:
        path: "./data/iso17"
        url: "https://paddle-org.bj.bcebos.com/paddlematerials/datasets/ISO17/iso17.tar.gz"
        subset: "val"
        split_file: "split_iso17_ref90_testother_seed42.npz"
        property_names: ${Global.label_names}
        build_graph_cfg: ${Global.graph_converter}
        seed: 42
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 32

  test:
    dataset:
      __class_name__: ISO17Dataset
      __init_params__:
        path: "./data/iso17"
        url: "https://paddle-org.bj.bcebos.com/paddlematerials/datasets/ISO17/iso17.tar.gz"
        subset: "test"
        split_file: "split_iso17_ref90_testother_seed42.npz"
        property_names: ${Global.label_names}
        build_graph_cfg: ${Global.graph_converter}
        seed: 42
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 32


Predict:
  graph_converter: ${Global.graph_converter}
  eval_with_no_grad: True
