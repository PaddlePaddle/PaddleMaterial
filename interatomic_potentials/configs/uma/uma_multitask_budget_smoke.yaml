# Small mixed-task training check using the prepared budget data only.
# OMat24/OC20 subsets are reused as stand-ins for all UMA task names so this
# verifies task propagation, dataset embedding, loss, backward, eval, and ckpt.
Global:
  do_train: True
  do_eval: True
  do_test: True
  label_names: ["energy", "forces"]
  prim_eager_enabled: True
  prim_backward_white_list: ["stack_grad", "assign_grad"]

Trainer:
  max_epochs: 1
  seed: 42
  output_dir: ./output/uma_multitask_budget_smoke
  save_freq: 1
  log_freq: 2
  start_eval_epoch: 1
  eval_freq: 1
  pretrained_model_path: null
  pretrained_weight_name: null
  resume_from_checkpoint: null
  use_amp: True
  amp_level: "O1"
  eval_with_no_grad: False
  gradient_accumulation_steps: 1
  best_metric_indicator: "eval_metric"
  name_for_best_metric: "energy"
  greater_is_better: False
  compute_metric_during_train: True
  metric_strategy_during_eval: "epoch"
  use_visualdl: False
  use_wandb: False
  use_tensorboard: False

Model:
  __class_name__: __import__("ppmat.models.uma.escn_md", fromlist=["UMASingleTaskModel"]).UMASingleTaskModel
  __init_params__:
    freeze_backbone: False
    head_name: MLP_EFS_Direct_Head
    head_params:
      reduce: mean
      wrap_property: True
    loss_type: mae
    loss_weights:
      energy: 10.0
      forces: 30.0
    backbone_params:
      max_num_elements: 100
      sphere_channels: 128
      edge_channels: 128
      hidden_channels: 128
      num_distance_basis: 64
      num_layers: 4
      lmax: 2
      mmax: 2
      otf_graph: True
      max_neighbors: 30
      cutoff: 6.0
      direct_forces: True
      regress_forces: False
      direct_stress: False
      regress_stress: False
      use_dataset_embedding: True
      dataset_mapping:
        omat: omat
        oc20: oc20
        omol: omol
        odac: odac
        omc: omc
      use_quaternion_wigner: False
      norm_type: rms_norm_sh
      act_type: gate
      ff_type: spectral
      execution_mode: general

Optimizer:
  __class_name__: AdamW
  __init_params__:
    lr:
      __class_name__: Cosine
      __init_params__:
        learning_rate: 8.0e-4
        eta_min: 8.0e-6
        by_epoch: False
    weight_decay: 1.0e-3

Metric:
  energy:
    __class_name__: IgnoreNanMetricWrapper
    __init_params__:
      __class_name__: paddle.nn.L1Loss
      __init_params__: {}
  forces:
    __class_name__: IgnoreNanMetricWrapper
    __init_params__:
      __class_name__: paddle.nn.L1Loss
      __init_params__: {}

Dataset:
  train:
    dataset:
      __class_name__: __import__("ppmat.models.uma.single_dataset", fromlist=["UMAMultiDataset"]).UMAMultiDataset
      __init_params__:
        datasets:
          - __class_name__: __import__("ppmat.models.uma.single_dataset", fromlist=["UMAAseDBDataset"]).UMAAseDBDataset
            __init_params__:
              src: ./data/omat24/train/rattled-500
              dataset_name: omat24-train-as-omat
              task_name: omat
              include_energy: True
              include_forces: True
              include_stress: False
              select_args: {limit: 8, offset: 0}
          - __class_name__: __import__("ppmat.models.uma.single_dataset", fromlist=["UMAAseDBDataset"]).UMAAseDBDataset
            __init_params__:
              src: ./data/oc20/uma_budget_aselmdb/train/train.aselmdb
              dataset_name: oc20-train-as-oc20
              task_name: oc20
              include_energy: True
              include_forces: True
              include_stress: False
              select_args: {limit: 8, offset: 0}
          - __class_name__: __import__("ppmat.models.uma.single_dataset", fromlist=["UMAAseDBDataset"]).UMAAseDBDataset
            __init_params__:
              src: ./data/omat24/train/rattled-500
              dataset_name: omat24-train-as-omol
              task_name: omol
              include_energy: True
              include_forces: True
              include_stress: False
              select_args: {limit: 8, offset: 16}
          - __class_name__: __import__("ppmat.models.uma.single_dataset", fromlist=["UMAAseDBDataset"]).UMAAseDBDataset
            __init_params__:
              src: ./data/omat24/val/rattled-500
              dataset_name: omat24-val-as-odac
              task_name: odac
              include_energy: True
              include_forces: True
              include_stress: False
              select_args: {limit: 8, offset: 0}
          - __class_name__: __import__("ppmat.models.uma.single_dataset", fromlist=["UMAAseDBDataset"]).UMAAseDBDataset
            __init_params__:
              src: ./data/oc20/uma_budget_aselmdb/train/train.aselmdb
              dataset_name: oc20-train-as-omc
              task_name: omc
              include_energy: True
              include_forces: True
              include_stress: False
              select_args: {limit: 8, offset: 16}
    loader:
      num_workers: 0
      use_shared_memory: False
      collate_fn: UMASingleCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: True
        drop_last: True
        batch_size: 5

