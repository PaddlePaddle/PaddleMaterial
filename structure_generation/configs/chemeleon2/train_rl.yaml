task_name: train_rl_chemeleon2

seed: 0

data:
  dataset_name: mp_20
  data_path: data/mp_20
  batch_size: 8
  num_workers: 4
  shuffle: True
  max_num_atoms: 100

model:
  name: chemeleon2_rl
  
  ldm_ckpt_path: null
  
  rl_configs:
    clip_ratio: 0.2
    kl_weight: 0.1
    entropy_weight: 0.01
    num_group_samples: 4
    group_reward_norm: True
    num_inner_batch: 1
  
  sampling_configs:
    sampler: ddim
    sampling_steps: 50
    eta: 1.0
    cfg_scale: 2.0
    return_trajectory: False
  
  reward_components:
    - name: creativity
      weight: 1.0
      config:
        distance_metric: amd
        reference_set: training_set
    
    - name: energy
      weight: 0.5
      config:
        calculator: mace
        model_path: null
    
    - name: structure_diversity
      weight: 0.3
      config:
        distance_metric: mmd
        kernel: rbf
    
    - name: composition_diversity
      weight: 0.2
      config:
        featurizer: composition
    
    - name: predictor
      weight: 0.5
      config:
        predictor_path: null
        target_property: formation_energy

optimizer:
  name: AdamW
  learning_rate: 1e-5
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.999
  epsilon: 1e-8

scheduler:
  name: constant
  warmup_steps: 0

training:
  max_steps: 5000
  log_interval: 1
  eval_interval: 5
  save_interval: 100
  grad_clip: 1.0
  
  checkpoint:
    monitor: val_reward
    mode: max
    save_top_k: 3
  
  early_stopping:
    monitor: val_reward
    patience: 200
    mode: max

output:
  save_dir: output/chemeleon2/rl
  checkpoint_dir: checkpoints
  log_dir: logs

ckpt_path: null
resume_from: null
