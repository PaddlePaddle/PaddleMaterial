# @package _global_
defaults:
  - Run: default                        # Runtime settings (paths, devices, etc.)
  - Logger: default                     # Logging configuration
  - Dataset: mp20                       # Dataset configuration (e.g., mp2018, jarvis)
  - Model: diffcsp                      # Model architecture (e.g., comformer, megnet)
  - Trainer: default                    # Training loop configuration
  - Optimizer: Adam                     # Optimizer
  - Learning_rate: ReduceOnPlateau      # Learning rate
  - Loss: L1Loss                        # Loss function
  - _self_

Global:
  model_name: diffcsp     # Model identifier used in output directory naming
  dataset_name: mp20   # Dataset identifier used in output directory naming
  do_train: True
  do_eval: False
  do_test: False
  seed: 42

Experiment:
  # The target property used for model selection (best metric)
  # name_for_best_metric: ${Global.label_names[0]}
  name_for_best_metric: 'loss'
  # Number of training timesteps for diffusion scheduler
  num_train_timesteps: 1000

Sample:
  data:
    dataset:
      __class_name__: MP20Dataset
      __init_params__:
        path: "${Run.data_dir}/mp_20/test.csv"
        build_structure_cfg:
          format: cif_str
          num_cpus: 10
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 256
  build_structure_cfg:
    format: array
    niggli: False
  metrics:
    __class_name__: CSPMetric
    __init_params__:
      gt_file_path: "${Run.data_dir}/mp_20/test.csv"
  model_sample_params:
    num_inference_steps: 1000

hydra:
  job:
    name: structgen
    chdir: True
  run:
    # Output directory includes model name, dataset name, label, timestamp, and seed
    dir: ./output/${Global.model_name}_${Global.dataset_name}_${hydra.job.name}/t_${now:%Y%m%d_%H%M%S}_seed_${Global.seed}

# ==========================================
# Custom parameters (will override defaults)
# ==========================================

Trainer:
  max_epochs: 1000
  best_metric_indicator: 'eval_loss'
  compute_metric_during_train: False
  metric_strategy_during_eval: 'step'

Optimizer:
  __init_params__:
    beta1: 0.9
    beta2: 0.999
