Global:
  label_names:
    - energy
  do_train: True
  do_eval: True
  do_test: True

Model:
  __class_name__: SphereNetPP
  __init_params__:
    energy_and_force: True
    cutoff: 5.0
    num_layers: 4
    hidden_channels: 128
    out_channels: 1
    int_emb_size: 64
    basis_emb_size_dist: 8
    basis_emb_size_angle: 8
    basis_emb_size_torsion: 8
    out_emb_channels: 256
    num_spherical: 7
    num_radial: 6
    envelope_exponent: 5
    num_before_skip: 1
    num_after_skip: 2
    num_output_layers: 3
    output_init: zeros
    property_name: energy

Dataset:
  train:
    dataset:
      __class_name__: MD17Dataset
      __init_params__:
        path: ./data/md17
        name: malonaldehyde
        split: train
        force_key: force
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 128
        shuffle: True
        drop_last: True
  val:
    dataset:
      __class_name__: MD17Dataset
      __init_params__:
        path: ./data/md17
        name: malonaldehyde
        split: val
        force_key: force
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 128
        shuffle: False
        drop_last: False
  test:
    dataset:
      __class_name__: MD17Dataset
      __init_params__:
        path: ./data/md17
        name: malonaldehyde
        split: test
        force_key: force
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 128
        shuffle: False
        drop_last: False

Optimizer:
  __class_name__: Adam
  __init_params__:
    beta1: 0.9
    beta2: 0.999
    lr:
      __class_name__: Cosine
      __init_params__:
        learning_rate: 0.0005
        eta_min: 0.00001
        by_epoch: True

Metric:
  energy:
    __class_name__: paddle.nn.L1Loss
    __init_params__: {}

Trainer:
  max_epochs: 500
  seed: 42
  output_dir: ./output/spherenet_malonaldehyde
  save_freq: 50
  log_freq: 10
  start_eval_epoch: 1
  eval_freq: 1
  use_amp: False
  eval_with_no_grad: True
  gradient_accumulation_steps: 1
  best_metric_indicator: eval_metric
  name_for_best_metric: energy
  greater_is_better: False
  compute_metric_during_train: False
  metric_strategy_during_eval: step
  pretrained_model_path: null
