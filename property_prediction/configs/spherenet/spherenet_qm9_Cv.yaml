Global:
  label_names:
    - Cv
  do_train: true
  do_eval: true
  do_test: true

Trainer:
  # Max epochs to train
  max_epochs: 100
  # Random seed
  seed: 42
  # Save path for checkpoints and logs
  output_dir: ./output/spherenet_qm9_Cv
  # Save frequency [epoch]; set 0 to disable saving during training
  save_freq: 50
  # Logging frequency [step]
  log_freq: 10
  # Start evaluation epoch
  start_eval_epoch: 1
  # Evaluation frequency [epoch]; set 0 to disable evaluation
  eval_freq: 1
  # Whether to use automatic mixed precision
  use_amp: false
  # Whether to run evaluation with no_grad (saves memory)
  eval_with_no_grad: true
  # Gradient accumulation steps
  gradient_accumulation_steps: 1
  # Best metric indicator: "train_loss", "eval_loss", "train_metric", "eval_metric"
  best_metric_indicator: eval_metric
  # Name of the best metric for checkpoint selection
  name_for_best_metric: Cv
  # Whether a greater metric value is better
  greater_is_better: false
  # Compute metric during training
  compute_metric_during_train: false
  # Metric computation strategy during eval: "step" or "epoch"
  metric_strategy_during_eval: step
  # Pretrained model path; null means no pretrained model
  pretrained_model_path:
Model:
  __class_name__: SphereNetPP
  __init_params__:
    energy_and_force: false
    cutoff: 5.0
    num_layers: 4
    hidden_channels: 128
    out_channels: 1
    int_emb_size: 64
    basis_emb_size_dist: 8
    basis_emb_size_angle: 8
    basis_emb_size_torsion: 8
    out_emb_channels: 256
    num_spherical: 7
    num_radial: 6
    envelope_exponent: 5
    num_before_skip: 1
    num_after_skip: 2
    num_output_layers: 3
    output_init: zeros
    property_name: Cv

Metric:
  Cv:
    __class_name__: paddle.nn.L1Loss
    __init_params__: {}
Optimizer:
  __class_name__: Adam
  __init_params__:
    beta1: 0.9
    beta2: 0.999
    lr:
      __class_name__: Cosine
      __init_params__:
        learning_rate: 0.0005
        eta_min: 0.00001
        by_epoch: true

Dataset:
  train:
    dataset:
      __class_name__: QM9Dataset
      __init_params__:
        path: ./data
        property_names: [Cv]
        split: train
        build_graph_cfg:
          __class_name__: RadiusGraph
          __init_params__:
            cutoff: 5.0
    loader:
      num_workers: 4
      use_shared_memory: false
      collate_fn: MolecularGraphCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 8
        shuffle: true
        drop_last: true
  val:
    dataset:
      __class_name__: QM9Dataset
      __init_params__:
        path: ./data
        property_names: [Cv]
        split: val
        build_graph_cfg:
          __class_name__: RadiusGraph
          __init_params__:
            cutoff: 5.0
    loader:
      num_workers: 4
      use_shared_memory: false
      collate_fn: MolecularGraphCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 8
        shuffle: false
        drop_last: false
  test:
    dataset:
      __class_name__: QM9Dataset
      __init_params__:
        path: ./data
        property_names: [Cv]
        split: test
        build_graph_cfg:
          __class_name__: RadiusGraph
          __init_params__:
            cutoff: 5.0
    loader:
      num_workers: 4
      use_shared_memory: false
      collate_fn: MolecularGraphCollator
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        batch_size: 8
        shuffle: false
        drop_last: false
