Global:
  label_names: ["Class"]
  do_train: True
  do_eval: True
  do_test: False

Trainer:
  max_epochs: 30
  seed: 42                          # 与 chemprop 统一
  output_dir: ./output/wd_mpnn_bace
  save_freq: 10
  log_freq: 10
  start_eval_epoch: 1
  eval_freq: 1
  pretrained_model_path: null
  pretrained_weight_name: null
  resume_from_checkpoint: null
  use_amp: False
  amp_level: 'O1'
  eval_with_no_grad: True
  gradient_accumulation_steps: 1
  best_metric_indicator: 'eval_metric'
  name_for_best_metric: "Class"
  greater_is_better: True           # 分类任务：AUC 越大越好
  compute_metric_during_train: True
  metric_strategy_during_eval: 'step'
  use_visualdl: False
  use_wandb: False
  use_tensorboard: False

Model:
  __class_name__: WDMPNN
  __init_params__:
    hidden_size: 300
    depth: 3
    dropout: 0.0
    activation: 'ReLU'
    undirected: False
    atom_messages: False
    bias: False
    aggregation: 'mean'
    aggregation_norm: 100
    ffn_num_layers: 2
    ffn_hidden_size: 300
    num_tasks: 1
    dataset_type: 'classification'  # 分类任务
    number_of_molecules: 1
    mpn_shared: False
    features_only: False
    features_size: 0
    use_input_features: False
    atom_descriptors: null
    atom_descriptors_size: 0
    multiclass_num_classes: 3
    property_name: 'Class'
    label_names: ['Class']

Metric:
  Class:
    __class_name__: paddle.nn.BCEWithLogitsLoss    # 二分类交叉熵损失
    __init_params__: {}

Optimizer:
  __class_name__: Adam
  __init_params__:
    beta1: 0.9
    beta2: 0.999
    lr:
      __class_name__: Cosine
      __init_params__:
        learning_rate: 0.001
        eta_min: 0.0001
        by_epoch: True

Dataset:
  train:
    dataset:
      __class_name__: WDMPNNDataset
      __init_params__:
        path: "./data/bace.csv"         # BACE 数据集
        smiles_columns: ["mol"]         # BACE 数据集的 SMILES 列名
        target_columns: ["Class"]       # BACE 数据集的目标列名
    loader:
      num_workers: 0
      use_shared_memory: False
      collate_fn: WDMPNNCollator
      collate_params:
        label_names: ["Class"]
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: True
        drop_last: True
        batch_size: 50
  val:
    dataset:
      __class_name__: WDMPNNDataset
      __init_params__:
        path: "./data/bace.csv"         # 全量数据也用于验证（与 train 相同）
        smiles_columns: ["mol"]
        target_columns: ["Class"]
    loader:
      num_workers: 0
      use_shared_memory: False
      collate_fn: WDMPNNCollator
      collate_params:
        label_names: ["Class"]
    sampler:
      __class_name__: BatchSampler
      __init_params__:
        shuffle: False
        drop_last: False
        batch_size: 50

Predict:
  eval_with_no_grad: True
