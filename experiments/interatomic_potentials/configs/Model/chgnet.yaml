__class_name__: CHGNet
__init_params__:
  atom_fea_dim: 64
  bond_fea_dim: 64
  angle_fea_dim: 64
  composition_model: "MPtrj"
  num_radial: 31
  num_angular: 31
  n_conv: 4
  atom_conv_hidden_dim: 64
  update_bond: True
  bond_conv_hidden_dim: 64
  update_angle: True
  angle_layer_hidden_dim: 0
  conv_dropout:  0
  read_out: "ave"
  mlp_hidden_dims: [64, 64, 64]
  mlp_dropout:  0
  mlp_first: True
  is_intensive: True
  atom_graph_cutoff:  6
  bond_graph_cutoff:  3
  cutoff_coeff: 8
  learnable_rbf: True
  is_freeze: False
  property_names: ${Global.label_names}
  return_site_energies: False
  return_atom_feas: False
  return_crystal_feas: False
