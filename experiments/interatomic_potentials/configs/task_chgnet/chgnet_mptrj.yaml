# @package _global_
defaults:
  - /Run: default                             # Default runtime settings
  - /Logger: default                          # Logging settings
  - /Dataset: mptrj                           # Dataset configuration (MPtrj dataset)
  - /Graph_converter: CHGNetGraphConverter    # Convert atomic structures to graph representations
  - /Model: chgnet                            # Model configuration (CHGNet)
  - /Trainer: default                         # Trainer configuration
  - /Optimizer: Adam                          # Optimizer configuration
  - /Learning_rate: Cosine                    # Learning rate scheduler configuration
  - /Loss: L1Loss_IgnoreNanMetricWrapper      # Loss function
  - _self_

Global:
  label_names: ['energy_per_atom', 'force', 'stress', 'magmom']
  model_name: "chgnet"
  dataset_name: "mptrj"
  do_train: True
  do_eval: False
  do_test: False
  seed: 42

Experiment:
  name_for_best_metric: "energy_per_atom"
  prim_eager_enabled: True
  prim_backward_white_list: ['concat_grad', 'gather_grad', 'layer_norm_grad', 'split_grad']

_Metric:
  keys: ${Global.label_names}
  values:
    - ${Loss}
    - ${Loss}
    - ${Loss}
    - ${Loss}

Predict:
  graph_converter: ${Graph_converter}
  eval_with_no_grad: False

hydra:
  job:
    name: mlip
    chdir: True
  run:
    dir: ./output/${Global.model_name}_${Global.dataset_name}_${hydra.job.name}/t_${now:%Y%m%d_%H%M%S}_seed_${Global.seed}

# ==========================================
# Custom parameters (will override defaults)
# ==========================================

Trainer:
  max_epochs: 20
  save_freq: 1
  log_freq: 1
  eval_with_no_grad: False

Learning_rate:
  __init_params__:
    eta_min: 1e-5
    by_epoch: False
