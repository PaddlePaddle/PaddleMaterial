# @package _global_
defaults:
  - /Run: default
  - /Logger: default
  - /Dataset: matbench
  - /Dataset/transform: custom_scaling
  - /Graph_converter: FindPointsInSpheres
  - /Model: megnet
  - /Trainer: default
  - /Optimizer: Adam
  - /Learning_rate: Cosine
  - /Loss: L1Loss
  - _self_

Global:
  label_names: ["log10(K_VRH)"]
  model_name: "megnet"
  dataset_name: "matbench"
  do_train: True
  do_eval: False
  do_test: False
  seed: 42

Experiment:
  name_for_best_metric: ${Global.label_names[0]}

_Metric:
  keys: ${Global.label_names}
  values:
    - ${Loss}

Predict:
  graph_converter: ${Graph_converter}
  eval_with_no_grad: True

hydra:
  job:
    name: ${Global.label_names[0]}
    chdir: True
  run:
    dir: ./output/${Global.model_name}_${Global.dataset_name}_${hydra.job.name}/t_${now:%Y%m%d_%H%M%S}_seed_${Global.seed}

# ==========================================
# Custom parameters (will override defaults)
# ==========================================

# Trainer:
#   max_epochs: 1000
#   save_freq: 1
#   log_freq: 1

Dataset:
  transform:
    __init_params__:
      mean: 1.880446
      std: 0.369314

Optimizer:
  __init_params__:
    beta1: 0.9
    beta2: 0.999

Learning_rate:
  __init_params__:
    eta_min: 0.0001
