# =========================================================
# Dataset configuration
# =========================================================
dataset:
  __class_name__: MatbenchDataset
  __init_params__:
    property_names: ${Global.label_names}
    path: "${Run.data_dir}/matbench"
    cache_path: "${Run.data_dir}/matbench_cache"
    build_structure_cfg:
      format: structure
    build_graph_cfg: ${Graph_converter}
    max_samples: null  # Use all samples (~106k)
    overwrite: False  # Don't overwrite cache unless necessary
    filter_unvalid: True
  loader:
    num_workers: 8
    use_shared_memory: False

# =========================================================
# Dataset splitting ratios
# =========================================================
split_dataset_ratio:
  train: 0.8
  val: 0.1
  test: 0.1

# =========================================================
# Data samplers for batching
# =========================================================
train_sampler:
  __class_name__: BatchSampler
  __init_params__:
    shuffle: True
    drop_last: False
    batch_size: 64

val_sampler:
    __class_name__: BatchSampler
    __init_params__:
      shuffle: False
      drop_last: False
      batch_size: 64

test_sampler:
    __class_name__: BatchSampler
    __init_params__:
      shuffle: False
      drop_last: False
      batch_size: 64
