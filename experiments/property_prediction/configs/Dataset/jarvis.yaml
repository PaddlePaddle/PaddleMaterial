# =========================================================
# Dataset configuration
# =========================================================
dataset:
  __class_name__: JarvisDataset
  __init_params__:
    path: "${Run.data_dir}/jarvis"
    cache_path: "${Run.data_dir}/jarvis"
    jarvis_data_name: ${Experiment.jarvis_data_name}
    property_names: ${Global.label_names}
    build_structure_cfg:
      format: jarvis
      num_cpus: 10
    build_graph_cfg: ${Graph_converter}
  loader:
    num_workers: 4
    use_shared_memory: False

# =========================================================
# Dataset splitting ratios
# =========================================================
split_dataset_ratio:
  train: 0.8
  val: 0.1
  test: 0.1

# =========================================================
# Data samplers for batching
# =========================================================
train_sampler:
  __class_name__: BatchSampler
  __init_params__:
    shuffle: True
    drop_last: False
    batch_size: 128

val_sampler:
    __class_name__: BatchSampler
    __init_params__:
      shuffle: False
      drop_last: False
      batch_size: 128

test_sampler:
    __class_name__: BatchSampler
    __init_params__:
      shuffle: False
      drop_last: False
      batch_size: 128
